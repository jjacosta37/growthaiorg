# Local development: backend services plus the Vite dev server.
x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "true"
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://luka:luka@postgres:5432/luka
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  # One-shot: schema + admin user before anything else starts (beat needs its tables).
  migrate:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py bootstrap"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info

  # Vite dev server. It proxies /api to `web`, so the browser sees one origin and
  # Django's SameSite=Lax session cookie works without CORS.
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_TARGET: http://web:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: luka
      POSTGRES_PASSWORD: luka
      POSTGRES_DB: luka
    ports:
      - "5433:5432"  # host 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luka"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
