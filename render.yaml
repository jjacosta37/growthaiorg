# Render Blueprint for Luka: web, worker, beat, Redis, Postgres and the frontend static site.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. You're prompted for every `sync: false` value.
# Plans can be changed in the Dashboard later; preDeployCommand and background workers need paid plans.

envVarGroups:
  - name: luka-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.13"
      - key: LLM_MODEL_FAST
        value: claude-haiku-4-5-20251001
      - key: LLM_MODEL_WRITER
        value: claude-sonnet-5
      - key: REDDIT_SOURCE
        value: apify
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: luka
      - key: ENVIRONMENT
        value: production
      # Sentry error reporting. Prompted once here, so web, worker and beat all report
      # into the same project. Leave it blank to run with error reporting off.
      - key: SENTRY_DSN
        sync: false

services:
  - name: luka-web
    type: web
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py bootstrap
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - fromGroup: luka-shared
      - key: DATABASE_URL
        fromDatabase:
          name: luka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luka-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # The browser reaches the API through the static site's /api rewrite, so the
      # Referer Django sees is the frontend's origin, not this service's. Set this to
      # the frontend URL (e.g. https://luka-frontend.onrender.com) or POSTs fail CSRF.
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # Secrets: prompted once here; the worker and beat read them from this service.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LUKA_ADMIN_USERNAME
        sync: false
      - key: LUKA_ADMIN_PASSWORD
        sync: false
      - key: LUKA_ADMIN_EMAIL
        sync: false

  - name: luka-worker
    type: worker
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: luka-shared
      - key: DATABASE_URL
        fromDatabase:
          name: luka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luka-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: luka-web
          envVarKey: DJANGO_SECRET_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: luka-web
          envVarKey: ANTHROPIC_API_KEY
      - key: APIFY_TOKEN
        fromService:
          type: web
          name: luka-web
          envVarKey: APIFY_TOKEN
      - key: LANGSMITH_API_KEY
        fromService:
          type: web
          name: luka-web
          envVarKey: LANGSMITH_API_KEY

  # Celery beat: fires scheduled agent runs from the DatabaseScheduler. Run exactly one instance.
  - name: luka-beat
    type: worker
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info
    envVars:
      - fromGroup: luka-shared
      - key: DATABASE_URL
        fromDatabase:
          name: luka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luka-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: luka-web
          envVarKey: DJANGO_SECRET_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: luka-web
          envVarKey: ANTHROPIC_API_KEY
      - key: APIFY_TOKEN
        fromService:
          type: web
          name: luka-web
          envVarKey: APIFY_TOKEN
      - key: LANGSMITH_API_KEY
        fromService:
          type: web
          name: luka-web
          envVarKey: LANGSMITH_API_KEY

  # The frontend. /api/* is rewritten to the web service so the browser sees one
  # origin: Django's session cookie stays SameSite=Lax and no CORS is needed.
  # This mirrors the Vite dev proxy, so dev and production behave the same way.
  - name: luka-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        # Check this against the real luka-web URL after the first deploy:
        # Render appends a suffix if the service name is already taken.
        destination: https://luka-web.onrender.com/api/*
      # SPA fallback, last so it doesn't swallow /api.
      - type: rewrite
        source: /*
        destination: /index.html

  - name: luka-redis
    type: keyvalue
    plan: 256mb
    maxmemoryPolicy: noeviction  # it's a Celery broker: never drop queued tasks
    ipAllowList: []  # internal connections only

databases:
  - name: luka-db
    databaseName: luka
    user: luka
    plan: 0.1c-256mb
